site_name: Fejlődési, tevékenységi és étkezési tudástár
site_description: Családi, evidenciaalapú és Montessori-kompatibilis 0-6 éves gyerekfejlődési tudástár.
site_url: ""
use_directory_urls: true

theme:
  name: material
  language: hu
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Sötét mód
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Világos mód

extra_css:
  - assets/css/activity-browser.css
  - assets/css/recipe-browser.css

extra_javascript:
  - assets/js/activity-browser.js
  - assets/js/recipe-browser.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Kezdőlap: index.md
  - Elméleti háttér:
    - Áttekintés: 01_elmeleti_hatter/index.md
    - Montessori elvek otthon: 01_elmeleti_hatter/montessori_elvek.md
    - Montessori eredeti forrásokból: 01_elmeleti_hatter/montessori_eredeti_forrasok.md
    - Montessori elemi kitekintés: 01_elmeleti_hatter/montessori_elemi_kitekintes.md
    - Simone Davies könyvek otthon: 01_elmeleti_hatter/simone_davies_konyvek.md
    - Személyiségfejlődés: 01_elmeleti_hatter/szemelyisegfejlodes.md
    - Guided play: 01_elmeleti_hatter/guided_play.md
    - Végrehajtó funkciók: 01_elmeleti_hatter/vegrehajto_funkciok.md
    - Korai matematika: 01_elmeleti_hatter/korai_matematika.md
    - Nyelv és könyvek: 01_elmeleti_hatter/nyelv_es_konyvek.md
    - Mozgás és szenzoros fejlődés: 01_elmeleti_hatter/mozgas_szenzoros.md
  - Életkorok:
    - Áttekintés: 02_eletkorok/index.md
    - 0-3 hónap: 02_eletkorok/0-3_honap.md
    - 3-6 hónap: 02_eletkorok/3-6_honap.md
    - 6-9 hónap: 02_eletkorok/6-9_honap.md
    - 9-12 hónap: 02_eletkorok/9-12_honap.md
    - 12-18 hónap: 02_eletkorok/12-18_honap.md
    - 18-24 hónap: 02_eletkorok/18-24_honap.md
    - 2-3 év: 02_eletkorok/2-3_ev.md
    - 3-4 év: 02_eletkorok/3-4_ev.md
    - 4-5 év: 02_eletkorok/4-5_ev.md
    - 5-6 év: 02_eletkorok/5-6_ev.md
  - Tevékenységtár:
    - Kereső: 03_tevekenysegek/kereso.md
    - Szerkesztés és frissítés: 03_tevekenysegek/szerkesztes.md
  - Étkezés:
    - Áttekintés: 05_etkezes/index.md
    - 0–6 hónap: 05_etkezes/0-6_honap.md
    - Alapelvek: 05_etkezes/alapelvek.md
    - Responsive feeding: 05_etkezes/responsive_feeding.md
    - Textúrák és önálló evés: 05_etkezes/texturak.md
    - Vas és mikrotápanyagok: 05_etkezes/vas_es_mikrotapanyagok.md
    - Allergének: 05_etkezes/allergenek.md
    - Biztonság: 05_etkezes/biztonsag.md
    - Italok, só és cukor: 05_etkezes/italok_so_cukor.md
    - Válogatósság és családi étkezés: 05_etkezes/valogatossag.md
    - BLW és BLISS: 05_etkezes/blw_bliss.md
    - Receptkereső: 05_etkezes/receptkereso.md
    - Receptadatbázis szerkesztése: 05_etkezes/szerkesztes.md
    - Étkezési források: 05_etkezes/forrasok.md
  - Források:
    - Forráslista: 04_forrasok/forraslista.md
