site_name: Fejlődési és tevékenységi tudástár
site_description: Családi, evidenciaalapú és Montessori-kompatibilis 0-6 éves gyerekfejlődési tudástár.
site_url: ""
use_directory_urls: true

theme:
  name: material
  language: hu
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Sötét mód
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Világos mód

extra_css:
  - assets/css/activity-browser.css

extra_javascript:
  - assets/js/activity-browser.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Kezdőlap: index.md
  - Elméleti háttér:
    - Áttekintés: 01_elmeleti_hatter/index.md
    - Montessori elvek otthon: 01_elmeleti_hatter/montessori_elvek.md
    - Személyiségfejlődés: 01_elmeleti_hatter/szemelyisegfejlodes.md
    - Guided play: 01_elmeleti_hatter/guided_play.md
    - Végrehajtó funkciók: 01_elmeleti_hatter/vegrehajto_funkciok.md
    - Korai matematika: 01_elmeleti_hatter/korai_matematika.md
    - Nyelv és könyvek: 01_elmeleti_hatter/nyelv_es_konyvek.md
    - Mozgás és szenzoros fejlődés: 01_elmeleti_hatter/mozgas_szenzoros.md
  - Életkorok:
    - Áttekintés: 02_eletkorok/index.md
    - 0-3 hónap: 02_eletkorok/0-3_honap.md
    - 3-6 hónap: 02_eletkorok/3-6_honap.md
    - 6-9 hónap: 02_eletkorok/6-9_honap.md
    - 9-12 hónap: 02_eletkorok/9-12_honap.md
    - 12-18 hónap: 02_eletkorok/12-18_honap.md
    - 18-24 hónap: 02_eletkorok/18-24_honap.md
    - 2-3 év: 02_eletkorok/2-3_ev.md
    - 3-4 év: 02_eletkorok/3-4_ev.md
    - 4-5 év: 02_eletkorok/4-5_ev.md
    - 5-6 év: 02_eletkorok/5-6_ev.md
  - Tevékenységtár:
    - Kereső: 03_tevekenysegek/kereso.md
    - Szerkesztés és frissítés: 03_tevekenysegek/szerkesztes.md
  - Források:
    - Forráslista: 04_forrasok/forraslista.md
